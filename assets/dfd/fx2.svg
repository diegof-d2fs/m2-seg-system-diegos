<text x="20" y="209" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#263542">TB-01 separa cliente e servidor. TB-02 delimita a implantação. TB-03 indica a passagem lógica aos dados.</text>
